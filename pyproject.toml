[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meaning-space-runtime"
version = "0.1.0"
description = "Meaning Space Runtime (MSR) — the L2/L3 runtime layer of SensOS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.6", "hypothesis>=6.100"]

[tool.hatch.build.targets.wheel]
packages = ["src/msr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["msr"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "experiments"]
plugins = []

# nvs_kernel (EXP-Ubuntu004's experiments/exp_msr_004_recovery.py only) ships no
# py.typed marker. It is not this project's dependency -- MSR imports no neighbour
# code (RFC-MSR01 Section 1) -- this override only lets the one experiment file
# that deliberately crosses that boundary type-check, without fabricating types
# for a package this repo does not own.
#
# Running `mypy` (it is in `files` above) or `python experiments/exp_msr_004_recovery.py`
# requires the sibling nvs-kernel repository installed into this venv first --
# it is not a PyPI package and is deliberately not listed under
# [project.optional-dependencies], since it cannot actually be installed from
# there. See docs/RFC_ALIGNMENT.md ("Gate dependency: nvs-kernel").
#     pip install -e ../nvs-kernel
[[tool.mypy.overrides]]
module = ["nvs_kernel.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF002/RUF003: Greek letters (θ, Σ, Φ, γ) are the domain's notation, not typos.
# N818: the error names are the domain's vocabulary; an Error suffix on every one
#       of them makes call sites read worse, and MSRError already marks the base.
ignore = ["RUF002", "RUF003", "N818"]
